services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixstore
      POSTGRES_USER: pixstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  pixstore:
    image: ${PIXSTORE_IMAGE:-ghcr.io/fathah/pixstore:latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://pixstore:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/pixstore?sslmode=disable
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      STORAGE_PATH: /app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8081}:8080"
    volumes:
      - image_data:/app/storage

volumes:
  postgres_data:
  image_data:
